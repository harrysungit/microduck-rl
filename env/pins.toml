# Pinned sources for the ROCm training environment; env/setup.sh reads this file.
#
# Python packages follow the uv.lock of Pollen Robotics' microduck_rl at the
# pinned commit, so the physics matches the official models; only Warp and
# torch are ROCm builds.

[repos.microduck_rl]
# Pollen Robotics' task configs, robot models and actuator code, used unchanged.
url = "https://github.com/pollen-robotics/microduck_rl.git"
commit = "8d0db74916a4f833d1d9b95d6a1d7f4d13b9d5ec"

[repos.warp]
# Warp with a HIP backend; validated on gfx1151 only.
url = "https://github.com/AMD-Ecosystem/warp.git"
branch = "amd-integration-halo"
commit = "74014999a31471228e0aaa213bbeb2e5daba95f0"  # 1.17.0.dev4
build = "HIP_ARCH=gfx1151 ROCM_PATH=/opt/rocm ./build_amd.sh"

[pip]
python = "3.12"
mjlab = "1.3.0"
mujoco = "3.10.0"
mujoco-warp = "3.8.1"  # --no-deps; two local fixes in env/patches/
rsl-rl-lib = "5.0.1"
numpy = "2.4.1"
better-actuator-models = "git+https://github.com/Rhoban/bam.git@62bd8ce12154340be97e06f7f41a0ca8f116d967"

[pip.torch]
index = "https://rocm.nightlies.amd.com/v2/gfx1151/"
version = "2.12.0a0+rocm7.13.0a20260411"

[system]
rocm = "/opt/rocm 7.2.0"  # Warp builds against this; torch brings its own rocm-sdk
gpu = "gfx1151"
