[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microduck-rl"
version = "0.1.0.dev0"
description = "Microduck training on more servos and GPUs, on top of Pollen Robotics' microduck_rl"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12, <3.13"
dependencies = [
    # Pollen Robotics' task configs, robot models and actuator code, used unchanged.
    "mjlab-microduck @ git+https://github.com/pollen-robotics/microduck_rl.git@8d0db74916a4f833d1d9b95d6a1d7f4d13b9d5ec",
    "mjlab==1.3.0",
]

# mjlab imports every module named here before it looks up a task, so train,
# play and export all see these tasks and run with the patches they apply.
[project.entry-points."mjlab.tasks"]
microduck_rl = "microduck_rl.tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["params/*"]
